id: T21
slug: bytecode-vm
tier: expert
timeout_s: 1800
min_turns_estimate: 28
checker_runtime_s: 20
notes: >
  Implement an SVM-1 stack-VM interpreter (vm.py) from a complete written
  spec. Traps: signed 32-bit wraparound after every arithmetic op
  (including -2^31 * -1), DIV truncating toward zero and MOD following the
  dividend sign (both differ from Python // and %), rel16 jumps relative to
  the address after the operand, exact `VM ERROR: <reason>` strings with
  exit code 3, operand fetch checked before stack pops. Fixture has 3
  sample programs with expected outputs (incl. one teaching the DIV trap);
  grading runs 10 hidden programs covering wraparound, a div/mod sign
  matrix, fib(60) with wrap, fizzbuzz via the string table, nested CALL/RET,
  and all six error paths. Build hygiene: expected outputs generated by the
  reference VM and independently re-asserted in the builder (fib computed
  separately, div/mod matrix recomputed, every error string matched).
